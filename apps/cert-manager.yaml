# Issues and renews the platform's TLS certificate.
#
# Runs ahead of everything else: the ClusterIssuer and the Ingress that asks for a
# certificate are meaningless until cert-manager's CRDs exist, so this carries a
# negative wave to be installed before the rest of the platform is considered.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      values: |
        crds:
          enabled: true
        # A single replica is right for one node; the webhook still gates every
        # Certificate, so correctness does not depend on the count.
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
