# Namespace, analysis gate and ingress
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Lower waves run first: namespace and secrets, then infrastructure, then
    # the services that depend on them.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git@github.com:Danindu05/duothan-gitops.git
    targetRevision: main
    # Only the files directly in manifests/ — the subdirectories are owned by
    # the per-component Applications. Argo CD does not recurse by default, and
    # it drops an explicit `recurse: false` when it stores the Application, so
    # stating it here would leave this app permanently OutOfSync.
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: aegis
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
