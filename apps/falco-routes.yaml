# How the Falco UI is reached.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco-routes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:Danindu05/duothan-gitops.git
    targetRevision: main
    path: manifests/falco
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 20s, factor: 2, maxDuration: 5m }
