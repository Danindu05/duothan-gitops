# Loans and repayments
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-lending
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Lower waves run first: namespace and secrets, then infrastructure, then
    # the services that depend on them.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Danindu05/duothan-gitops.git
    targetRevision: main
    path: manifests/services/lending
  destination:
    server: https://kubernetes.default.svc
    namespace: aegis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
