# Lending, rendered from the shared chart rather than a hand-written manifest.
#
# Switched first, and alone, because it is Tier 3: the tier the platform sheds
# first under load, so it is the service whose disruption costs least. If the
# chart and the hand-written manifest disagree about anything, this is where that
# should surface.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-lending
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:Danindu05/duothan-gitops.git
    targetRevision: main
    path: charts/aegis-service
    helm:
      valueFiles:
        - ../../environments/base/lending.yaml
        - ../../environments/production/values.yaml
      parameters:
        - name: image.registry
          value: danindu05
        - name: image.tag
          value: sha-e21d882
  destination:
    server: https://kubernetes.default.svc
    namespace: aegis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
