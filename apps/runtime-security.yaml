# Falco — watching what containers actually do, once they are already running.
#
# Everything else in this pipeline judges code before it runs: tests, scanners,
# signatures, admission policy. All of it is reasoning about an artefact. Runtime
# detection is the only layer that sees behaviour, and behaviour is where an attack
# eventually has to show itself.
#
# This is the control the blueprint argues for most directly. The Super Malware
# Agent was unknown when it struck, so nothing matching on signatures could have
# recognised it — but it still had to do recognisable things: open a shell inside a
# container, read credentials, reach somewhere it had no business reaching. Falco
# watches for the doing rather than the identity.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.1.0
    helm:
      values: |
        # Modern eBPF, and no driver to obtain at all.
        #
        # The legacy probe was tried first and cannot work here: there is no
        # prebuilt driver published for this kernel (6.17 on Azure returns 404),
        # so the loader falls back to compiling one, which wants kernel headers
        # and more memory than the init container had - it was killed for
        # overrunning its limit.
        #
        # modern_ebpf needs none of that. It failed earlier for a different reason:
        # the probe could not initialise without privileges, which the chart's
        # defaults withhold. With those granted below, the mechanism that needs no
        # driver is also the one this kernel supports properly.
        # Falco 0.44 rather than 0.39. The buffer settings were applied correctly
        # and the kernel has everything the mechanism needs - BTF, the bpf syscall,
        # privileges - so what was left was the driver itself not knowing this
        # kernel. 6.17 is newer than the release that was pinned here.
        driver:
          enabled: true
          kind: modern_ebpf
          modernEbpf:
            # A smaller ring buffer than the 8 MB default.
            #
            # The kernel supports this properly - BTF is present and the bpf
            # syscall is enabled - but allocation was failing at scap_init on a
            # two-core node with a modest memory ceiling. Buffers are locked
            # memory, so asking for less is the difference between a sensor that
            # starts and one that does not. Preset 2 is 2 MB per buffer; the cost
            # is that a burst of syscalls can drop events, which the drop counter
            # below reports rather than hides.
            bufSizePreset: 2
            cpusForEachBuffer: 2

        collectors:
          kubernetes:
            enabled: true

        # Rules are matched against a lot of syscalls. Leaving buffering on trades
        # a little latency for a great deal less CPU, which matters on two cores.
        falco:
          json_output: true
          json_include_output_property: true
          priority: notice
          buffered_outputs: true
          syscall_event_drops:
            actions: [log]
            rate: 0.03
            max_burst: 100

        resources:
          requests: { cpu: 100m, memory: 256Mi }
          # Room for the ring buffers, which are locked and counted against this.
          limits: { memory: 1Gi }

        # Falco watches syscalls for the whole node, which is inherently
        # privileged work. It is the one workload here that legitimately needs
        # this - and the reason it is worth having is that it sees what every
        # other control cannot: what a container does once it is already running.
        securityContext:
          privileged: true

        # -- Where alerts go -----------------------------------------------
        # Falcosidekick fans events out; its UI is what makes them readable by
        # somebody who is not tailing a log at three in the morning.
        falcosidekick:
          enabled: true
          # Falco addresses the collector as <falco-fullname>-falcosidekick, while
          # the subchart names itself after the release. The two disagreed, so every
          # event failed to post - the detections were happening and reaching
          # nobody, which is the same as not detecting them.
          fullnameOverride: runtime-security-falco-falcosidekick
          replicaCount: 1
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 160Mi }
          # No extra Prometheus labels configured. The label syntax this expects
          # is not the one it documents, and getting it wrong panics the process at
          # start-up rather than being ignored - the events reaching the UI matter
          # more than tagging the metrics about them.
          webui:
            enabled: true
            replicaCount: 1
            resources:
              requests: { cpu: 25m, memory: 96Mi }
              limits: { memory: 256Mi }
            redis:
              resources:
                requests: { cpu: 25m, memory: 96Mi }
                limits: { memory: 256Mi }

        # Let Prometheus scrape Falco itself, so "is the detection running" is a
        # question with an answer. A silent sensor and a quiet system look identical.
        serviceMonitor:
          enabled: true
          interval: 30s

        # -- Rules that matter here in particular --------------------------
        customRules:
          aegis-rules.yaml: |-
            - macro: aegis_namespace
              condition: (k8s.ns.name = "aegis")

            - rule: Shell opened in a banking container
              desc: >-
                Nothing in these images needs an interactive shell. Every service is
                a compiled binary or a Python process started by its entrypoint, so a
                shell means either somebody debugging in production or somebody who
                should not be there. Both are worth knowing about immediately.
              condition: >-
                spawned_process and container and aegis_namespace
                and proc.name in (bash, sh, ash, dash, zsh, ksh, csh)
              output: >-
                Shell opened inside a banking container
                (user=%user.name container=%container.name image=%container.image.repository
                command=%proc.cmdline pod=%k8s.pod.name)
              priority: WARNING
              tags: [aegis, shell, mitre_execution]

            - rule: Reconnaissance tooling in a banking container
              desc: >-
                These images ship no network tooling. Something that fetches or
                probes appearing inside one means a process is doing work the image
                was never built to do.

                The vault unsealer is exempt, and the exemption is narrow on
                purpose: that container polls the vault's own seal status on
                localhost, which is the one place a fetch here is expected. It was
                caught by this rule on the first day the sensor ran - a true
                positive against our own design - and the honest response to a
                detection that is correct but unwanted is to name the exception
                rather than widen the rule until it stops firing.
              condition: >-
                spawned_process and container and aegis_namespace
                and proc.name in (nc, ncat, netcat, nmap, socat, tcpdump, curl, wget, ssh, scp)
                and not (container.name = "unsealer" and proc.cmdline contains "127.0.0.1:8200")
              output: >-
                Network tool run inside a banking container
                (tool=%proc.name container=%container.name command=%proc.cmdline
                pod=%k8s.pod.name)
              priority: WARNING
              tags: [aegis, network, mitre_discovery]

            - rule: Credential material read in a banking container
              desc: >-
                Reading the service account token or the container's own secrets is
                the step between a foothold and moving sideways through the cluster.
              condition: >-
                open_read and container and aegis_namespace
                and (fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount
                     or fd.name startswith /run/secrets)
                and not proc.name in (dotnet, python3, uvicorn, vault)
              output: >-
                Credential material read inside a banking container
                (file=%fd.name process=%proc.name container=%container.name
                pod=%k8s.pod.name)
              priority: CRITICAL
              tags: [aegis, secrets, mitre_credential_access]

            - rule: Vault data touched by something other than Vault
              desc: >-
                The vault's storage holds the platform's key material. Only Vault
                itself has any reason to open it.
              condition: >-
                open_read and container and aegis_namespace
                and fd.name startswith /vault/data
                and not proc.name = vault
              output: >-
                Vault storage read by an unexpected process
                (file=%fd.name process=%proc.name container=%container.name)
              priority: CRITICAL
              tags: [aegis, vault, mitre_credential_access]
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  # The chart generates fresh credentials for the UI and its redis on every
  # render, so each comparison finds a difference that is not one. Left alone
  # this rewrites the passwords on every sync and restarts the UI with them.
  ignoreDifferences:
    - kind: Secret
      name: runtime-security-falco-falcosidekick-ui
      jsonPointers: [/data]
    - kind: Secret
      name: runtime-security-falco-falcosidekick-ui-redis
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 20s, factor: 2, maxDuration: 5m }
