# What production adds on top of the shared definition.
#
# This is the split the blueprint asks for: the chart packages what a service *is*,
# and this states what is true of it *here*. Keeping them apart is what stops an
# environment-specific decision — a registry, a replica count, a resource ceiling —
# from being baked into the definition every environment shares.
#
# Deliberately thin. An overlay that restates the whole service is not an overlay,
# and it reintroduces the duplication the chart removed.

image:
  # Docker Hub is what this cluster pulls. The images are signed there — keyless
  # signing does not depend on the registry, only on the certificate authority and
  # the transparency log.
  registry: danindu05
  pullPolicy: IfNotPresent
  # Rewritten by the promotion workflow after a successful build. Kept here rather
  # than in each Application so there is one line to change and one line to read
  # when asking what is deployed.
  tag: sha-ec50660

# Two replicas: enough for a canary to mean something (one carries the new
# revision while one carries the stable), and as many as one node should hold
# nine times over.
replicas: 2
