# Publishes Argo CD itself over TLS.
#
# Whoever signs in here can change what runs in the cluster, so their password is
# worth more than any single customer's — serving this over plain HTTP would put
# the most privileged credential on the platform on the wire in clear text.
#
# argocd-server runs with server.insecure set, meaning it speaks plain HTTP and
# expects TLS to be terminated in front of it. That is exactly what happens here,
# and it is why this must not be annotated as an HTTPS backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [argocd.20.219.189.234.nip.io]
      secretName: argocd-tls
  rules:
    - host: argocd.20.219.189.234.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port: { number: 80 }
---
# Plain HTTP is answered only so Let's Encrypt can fetch its challenge token, and
# so anyone arriving without a scheme is sent somewhere safe.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-http
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: argocd-https-redirect@kubernetescrd
spec:
  rules:
    - host: argocd.20.219.189.234.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port: { number: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: argocd
spec:
  redirectScheme:
    scheme: https
    permanent: true
