# HashiCorp Vault — custodian of the platform's key material. Runs in dev-less
# server mode with file storage on a persistent volume, initialised and unsealed
# by the bootstrap job below (Shamir 3-of-5, mirroring the Master Key model).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: aegis
data:
  vault.hcl: |
    ui = true
    disable_mlock = true
    storage "file" { path = "/vault/data" }
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }
    api_addr = "http://vault:8200"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-data
  namespace: aegis
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: aegis
  labels: { app: vault, tier: infrastructure }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: vault }
  template:
    metadata:
      labels: { app: vault, tier: infrastructure }
    spec:
      # The image ships as uid 100 / gid 1000; fsGroup makes the data volume
      # writable by that group so Vault can persist its storage.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          # Call the binary directly. The image's entrypoint tries to chown its
          # config and set file capabilities, neither of which an unprivileged
          # container may do — and neither of which Vault needs here, since the
          # config sets disable_mlock.
          command: ["vault"]
          args: ["server", "-config=/vault/config/vault.hcl"]
          ports: [{ name: http, containerPort: 8200 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /vault/config }
            - { name: data, mountPath: /vault/data }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: vault-config }
        - name: data
          persistentVolumeClaim: { claimName: vault-data }
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: aegis
spec:
  selector: { app: vault }
  ports: [{ name: http, port: 8200, targetPort: http }]
