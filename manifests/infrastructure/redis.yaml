apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aegis
  labels: { app: redis, tier: infrastructure }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: infrastructure }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aegis
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: redis }]
