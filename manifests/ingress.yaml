# Traefik routes the public hostname to the frontend, which proxies /api onward
# to the gateway. The preview colour is published on a separate host so a release
# can be exercised end to end before anyone promotes it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis
  namespace: aegis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-preview
  namespace: aegis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: preview.aegis.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-preview
                port: { number: 80 }
