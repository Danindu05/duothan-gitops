# Publishes Grafana over TLS.
#
# During an incident the people who need this are not necessarily at a terminal with
# cluster access, and a dashboard reachable only through a port-forward is a dashboard
# nobody looks at. It carries the same certificate machinery as everything else —
# metrics about a bank are worth reading in transit, and the sign-in is worth
# protecting.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [grafana.20.219.189.234.nip.io]
      secretName: grafana-tls
  rules:
    - host: grafana.20.219.189.234.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: observability-grafana
                port: { number: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-http
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: observability-https-redirect@kubernetescrd
spec:
  rules:
    - host: grafana.20.219.189.234.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: observability-grafana
                port: { number: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: observability
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Prometheus published so the raw data behind a dashboard can be
# interrogated during an incident, rather than only the picture drawn from it.
#
# No authentication of its own: Prometheus has none to offer. It is
# reachable by anyone who knows the address, which is acceptable for read-only
# telemetry about a demonstration platform and would not be in production, where
# this belongs behind the same sign-in as everything else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [prometheus.20.219.189.234.nip.io]
      secretName: prometheus-tls
  rules:
    - host: prometheus.20.219.189.234.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: observability-kube-prometh-prometheus
                port: { number: 9090 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-http
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: observability-https-redirect@kubernetescrd
spec:
  rules:
    - host: prometheus.20.219.189.234.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: observability-kube-prometh-prometheus
                port: { number: 9090 }
---
