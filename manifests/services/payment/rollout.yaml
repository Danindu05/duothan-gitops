# QR, bills, merchant acceptance, payroll, cards
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment
  namespace: aegis
  labels: { app: payment, tier: banking }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: payment }
  strategy:
    # Canary, per blueprint 7.5: money-moving services take a small share of live
    # traffic first, and every step is gated on the new version actually being
    # healthy under that traffic. A release that misbehaves is seen by a fraction
    # of customers for one analysis window rather than by all of them at once.
    #
    # Weight here is approximated by pod count — there is no service mesh on this
    # cluster — so with two replicas the meaningful steps are half and all. The
    # pauses are what make it a canary rather than a rolling update: each one is a
    # decision point where the analysis can stop the release.
    canary:
      maxSurge: 1
      maxUnavailable: 0
      analysis:
        templates: [{ templateName: service-health }]
        args: [{ name: service, value: payment-canary }]
        startingStep: 1
      canaryService: payment-canary
      stableService: payment
      steps:
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
        - pause: { duration: 30s }
  template:
    metadata:
      labels: { app: payment, tier: banking }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payment
          image: danindu05/aegis-payment:sha-061df74
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080, protocol: TCP }]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: DOTNET_SYSTEM_NET_DISABLEIPV6, value: "1" }
            # Workstation GC keeps each service near 70 MB instead of ~120 MB,
            # which matters when nine of them share one node.
            - { name: DOTNET_gcServer, value: "0" }
            - { name: Vault__Address, value: "http://vault:8200" }
            - { name: Services__Identity, value: "http://identity:8080" }
            - { name: Services__Account, value: "http://account:8080" }
            - { name: Services__Transaction, value: "http://transaction:8080" }
            - { name: Services__Payment, value: "http://payment:8080" }
            - { name: Services__Lending, value: "http://lending:8080" }
            - { name: Services__Platform, value: "http://platform:8080" }
            - { name: Services__Fraud, value: "http://fraud:8000" }
            - name: ConnectionStrings__RabbitMq
              value: "rabbitmq://guest:guest@rabbitmq:5672/"
            - name: ConnectionStrings__PaymentDb
              valueFrom:
                secretKeyRef: { name: aegis-databases, key: payment }
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef: { name: aegis-vault-approle, key: role_id }
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef: { name: aegis-vault-approle, key: secret_id }
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 400Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: aegis
  labels: { app: payment, role: active }
spec:
  selector: { app: payment }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-canary
  namespace: aegis
  labels: { app: payment, role: canary }
spec:
  selector: { app: payment }
  ports: [{ name: http, port: 8080, targetPort: http }]
