# Python fraud scoring. Deliberately a separate runtime; if it is unavailable the
# .NET services fall back to reduced rule-based limits rather than refusing to bank.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fraud
  namespace: aegis
  labels: { app: fraud, tier: banking }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: fraud }
  strategy:
    # Canary, per blueprint 7.5: money-moving services take a small share of live
    # traffic first, and every step is gated on the new version actually being
    # healthy under that traffic. A release that misbehaves is seen by a fraction
    # of customers for one analysis window rather than by all of them at once.
    #
    # Weight here is approximated by pod count — there is no service mesh on this
    # cluster — so with two replicas the meaningful steps are half and all. The
    # pauses are what make it a canary rather than a rolling update: each one is a
    # decision point where the analysis can stop the release.
    canary:
      maxSurge: 1
      maxUnavailable: 0
      analysis:
        templates: [{ templateName: service-health }]
        args:
          - { name: service, value: fraud-canary }
          - { name: port, value: "8000" }
        startingStep: 1
      canaryService: fraud-canary
      stableService: fraud
      steps:
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
        - pause: { duration: 30s }
  template:
    metadata:
      labels: { app: fraud, tier: banking }
    spec:
      containers:
        - name: fraud
          image: danindu05/aegis-fraud:sha-e21d882
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000, protocol: TCP }]
          resources:
            # scikit-learn and numpy make this the heaviest single container.
            requests: { cpu: 100m, memory: 300Mi }
            limits: { memory: 600Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: fraud
  namespace: aegis
  labels: { app: fraud, role: active }
spec:
  selector: { app: fraud }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-canary
  namespace: aegis
  labels: { app: fraud, role: canary }
spec:
  selector: { app: fraud }
  ports: [{ name: http, port: 8000, targetPort: http }]
