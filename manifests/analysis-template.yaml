# The gate a new version has to pass before it is allowed to keep serving.
#
# The check is deliberately dull: ask the new revision's own health endpoint,
# several times, a few seconds apart. Once is not evidence — a version that starts,
# answers, and then falls over on its first real request would sail through a single
# probe. Repeating it catches exactly that, which is the failure this exists to stop.
#
# A failure aborts the rollout, so Argo Rollouts holds traffic on the stable
# revision. A bad release becomes a release that never finished, rather than an
# incident somebody has to notice and undo.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: service-health
  namespace: aegis
spec:
  args:
    - name: service
    # Ports differ across the platform — the .NET services listen on 8080, the
    # Python fraud service on 8000. Assuming one of them meant the gate on the
    # other was checking a port nothing answered on.
    - name: port
      value: "8080"
  metrics:
    - name: health-check
      count: 5
      interval: 10s
      # No allowance: this already runs five times, and a gate that may fail is
      # not a gate.
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 120
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile: { type: RuntimeDefault }
                containers:
                  - name: probe
                    image: curlimages/curl:8.11.0
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: { drop: [ALL] }
                    command: [sh, -c]
                    args:
                      - |
                        url="http://{{args.service}}:{{args.port}}/health"
                        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || echo 000)
                        echo "health check $url -> $code"
                        # The job's exit status is the measurement: anything other
                        # than 200 fails the analysis and stops the rollout.
                        test "$code" = "200"
                    resources:
                      requests: { cpu: 10m, memory: 16Mi }
                      limits: { memory: 64Mi }
---
# The gate the blueprint actually asks for: judge a release on what customers are
# experiencing, not merely on whether the process is alive.
#
# A health endpoint answers 200 while the service returns 500 to every real request,
# because answering "am I up" is the one thing a broken service can usually still do.
# These two measurements come from the traffic itself — the share of requests failing,
# and how long the slowest tenth are waiting — so a release that is technically
# running but practically useless is caught and stopped.
#
# Both are evaluated against the canary revision alone. Averaging the new version
# together with the stable one hides exactly the signal the gate exists to find.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-metrics
  namespace: aegis
spec:
  args:
    - name: service
  metrics:
    - name: error-rate
      # Five readings a minute apart. Fewer would let a burst decide the release;
      # more would keep customers on a bad version longer than necessary.
      count: 5
      interval: 60s
      failureLimit: 1
      # An empty result passes, which is worth being explicit about because the
      # opposite was tried and was worse.
      #
      # Treating silence as failure sounds stricter and is: it also means no
      # release can complete whenever these metrics are unavailable — a service
      # that has not been asked anything yet, a version that predates the metrics
      # endpoint, or Prometheus itself being down. The platform then cannot be
      # deployed for a reason that has nothing to do with the release, including
      # the release that would fix the outage.
      #
      # The health check beside this one is the hard gate and does not depend on
      # any of that. This measurement adds a judgement the health check cannot
      # make — whether the version is serving errors — and withholds it honestly
      # when there is nothing to judge.
      successCondition: len(result) == 0 || result[0] < 0.05
      provider:
        prometheus:
          address: http://prometheus-operated.observability.svc:9090
          query: |
            sum(rate(http_requests_received_total{
              service="{{args.service}}", code=~"5.."
            }[2m]))
            /
            clamp_min(sum(rate(http_requests_received_total{
              service="{{args.service}}"
            }[2m])), 0.001)

    - name: latency-p95
      count: 5
      interval: 60s
      failureLimit: 1
      successCondition: len(result) == 0 || result[0] < 2
      provider:
        prometheus:
          address: http://prometheus-operated.observability.svc:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{
                service="{{args.service}}"
              }[2m]))
            )
