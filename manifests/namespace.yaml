apiVersion: v1
kind: Namespace
metadata:
  name: aegis
  labels:
    app.kubernetes.io/part-of: aegis
    # Enforce the restricted Pod Security Standard: no privilege escalation,
    # no root, no host access. A compromised service cannot reach the node.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
